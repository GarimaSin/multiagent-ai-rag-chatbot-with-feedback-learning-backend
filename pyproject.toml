[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-ai-rag-chatbot-with-feedback-learning-backend"
version = "1.0.0"
description = "Bounded multi-agent chat with private hybrid RAG and reviewed learning"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "pydantic==2.13.4",
  "pydantic-settings==2.14.1", "SQLAlchemy==2.0.50", "httpx==0.28.1",
  "prometheus-client==0.25.0"
]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "pytest-cov>=6,<8"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
